<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>ギリ — 触れるな、でも離れるな</title>
<style>
:root{--bg:#ece8de;--ink:#15130f;--red:#d7263d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ece8de}}
:root[data-theme="dark"]{--bg:#ece8de}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const INK='#15130f',RED='#d7263d',BG='#ece8de',F='"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';
let W,H,D=Math.min(devicePixelRatio||1,2);
function fit(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',fit);fit();
let sv={bank:0,up:[0,0,0,0,0],best:0};
try{Object.assign(sv,JSON.parse(localStorage.getItem('giri2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('giri2',JSON.stringify(sv))}catch(e){}};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let AC,pt=[],hstop=0,flash=0,pop=0,msg=null,ringT=9,zm=0,slowT=0,chain=0,chainT=0,beatT=0,bc=0,gs=0,pc=0,waveT=7,accT=11,wallT=14,armT=16,dr=null;
const PENT=[0,2,4,7,9];
const snd=(f,d,ty,v,sl)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}};
function burst(x,y,n,c,s){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=s*(.3+Math.random()*.7);pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,c,s:2+Math.random()*3})}}
// 永久強化 [名前, 説明, 最大Lv, 基本コスト(かすり回数)]
const UP=[['判定縮小','当たり判定が小さくなる',5,25],['かすり圏拡大','点線の輪が広がる',5,25],['倍率キープ','倍率が減りにくくなる',5,30],['初期シールド','開始時に1回、接触を防ぐ',3,60],['選択肢 +1','強化の候補が4枚になる',1,150],
['かすり得点','かすり・ギリの得点 +10%/Lv',5,40],['無敵延長','強化後の無敵時間 +0.25秒/Lv',3,50],['追跡猶予','追跡弾が出るまで +0.5秒/Lv',5,35],['弾減速','弾の速さ -3%/Lv',5,45],['かすり報酬','ラン後に得るかすり +10%/Lv',5,60]];
while(sv.up.length<UP.length)sv.up.push(0);
const bankGain=()=>Math.round(gc*(1+.1*sv.up[9]));
const cost=i=>UP[i][3]*(sv.up[i]+1);
// 1ラン限りの強化
const POOL=[
['かすり圏拡大','点線の輪がさらに広がる',0,r=>r.mag++],
['判定縮小','当たり判定がさらに小さくなる',0,r=>r.shr++],
['倍率キープ','倍率の減りが遅くなる',0,r=>r.hold*=.7],
['減速','弾が10%遅くなる',0,r=>r.spd*=.9],
['シールド','一度だけ接触を防ぐ',0,r=>r.shield++],
['猶予','追跡弾が出るまでが長くなる',0,r=>r.hom+=1.2],
['衝撃波','かすり8回ごとに周囲の弾を消す(盾付きは除く)',0,r=>r.blast=1],
['ギリ強化','「ギリ!」判定の得点が2倍',0,r=>r.pf*=2],
['欲張り','得点1.5倍 / 弾が増える',1,r=>{r.sc*=1.5;r.sp*=1.25}],
['光の誘惑','かすり得点1.5倍 / レーザー増加',1,r=>{r.gb*=1.5;r.lz*=.7}],
['経験値増加','レベルアップの経験値 +30%',0,r=>r.xp*=1.3],
['レベル加速','次のレベルまでが15%短くなる',0,r=>r.lv*=.85],
['無敵延長','強化した後の無敵時間 +1秒',0,r=>r.iv+=1],
['スローモーション','ギリの瞬間、時間がゆっくりになる',0,r=>r.slow++],
['ギリ衝撃波','ギリのたびに小さな衝撃波が出る',0,r=>r.pb++],
['盾の補充','ギリを重ねるとシールドが貯まる',0,r=>r.ps++],
['ギリ倍率','ギリ判定で倍率が大きく上がる',0,r=>r.pm++],
['危険な賭け','ギリ得点3倍 / 追跡弾が早く出る',1,r=>{r.pf*=3;r.hom=Math.max(-1.6,r.hom-1.2)}]];
let st='title',R,P,hs,ls,fx,t,score,xp,mult,sinceG,spawnT,laserT,gc,inv,shake,pickN,cards,deadT,newBest,tp=null,sc=0;
const MS=.3,MM=10,DK=.27,XB=550,XG=3.0,DF=1.4; // XB/XG: レベルアップ間隔(大きいほど遅い) DF: 難易度の進む速さ(1で元通り、大きいほど難しい)
// n+1回目の強化に必要な累計経験値。1レベルごとの必要量は XB×XG^n で増えていく
const th=n=>Math.round(XB*(Math.pow(XG,n+1)-1)/(XG-1)*R.lv);
const GR=()=>24+2.5*sv.up[1]+6*R.mag,HIT=()=>Math.max(1.2,3.5-.35*sv.up[0]-.8*R.shr),HT=()=>3.2+R.hom;
function startRun(){
  R={mag:0,shr:0,hold:1,spd:1-.03*sv.up[8],sc:1,sp:1,lz:1,gb:1+.1*sv.up[5],hom:.5*sv.up[7],blast:0,pf:1,xp:1,lv:1,iv:1.3+.25*sv.up[6],slow:0,pb:0,ps:0,gi:0,pm:1,shield:sv.up[3]};
  P={x:W/2,y:H*.72};hs=[];ls=[];fx=[];pt=[];hstop=0;flash=0;pop=0;msg=null;ringT=9;zm=0;slowT=0;chain=0;chainT=0;beatT=0;bc=0;gs=0;pc=0;waveT=7;accT=11;wallT=14;armT=16;t=0;score=0;xp=0;mult=1;sinceG=0;spawnT=.6;laserT=8;gc=0;inv=0;shake=0;pickN=0;newBest=false;st='play';tp=null}
startRun();st='title';
const inR=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
const B=i=>({x:W/2-120,y:H*.6+i*64,w:240,h:52});
const maxSc=()=>Math.max(0,120+UP.length*84-(H-100));
const row=i=>({x:16,y:120+i*84-sc,w:W-32,h:74});
const crd=i=>{const n=cards.length,ch=n===4?92:104;return{x:16,y:H*.2+i*(ch+10),w:W-32,h:ch}};
function down(cx,cy){snd(520,.05,'triangle',st==='play'?.001:.05,1.3);if(AC&&AC.state==='suspended')AC.resume();
  const r=cv.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;
  if(st==='title'){if(inR(x,y,B(0)))startRun();else if(inR(x,y,B(1))){st='shop';sc=0};return}
  if(st==='shop'){
    if(inR(x,y,{x:W/2-100,y:H-84,w:200,h:50})){st='title';tp=null;return}
    tp={y0:cy,sc0:sc,mv:0};return}
  if(st==='pick'){cards.forEach((c,i)=>{if(inR(x,y,crd(i))){c[3](R);inv=R.iv;snd(660,.18,'triangle',.08,2);flash=.3;st='play';tp=null;buzz(20)}});return}
  if(st==='over'){if(deadT>.6){if(inR(x,y,B(0)))startRun();else if(inR(x,y,B(1))){st='shop';sc=0}}return}
  tp={x:cx,y:cy}}
function up(cx,cy){
  if(st==='shop'&&tp&&!tp.mv){const r=cv.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;
    if(y>110&&y<H-100)UP.forEach((u,i)=>{if(inR(x,y,row(i))&&sv.up[i]<u[2]&&sv.bank>=cost(i)){sv.bank-=cost(i);sv.up[i]++;save();buzz(15)}})}
  tp=null}
function move(cx,cy){if(st==='shop'&&tp){const d=cy-tp.y0;if(Math.abs(d)>8)tp.mv=1;sc=Math.max(0,Math.min(maxSc(),tp.sc0-d));return}
  if(st!=='play'||!tp)return;
  P.x=Math.max(8,Math.min(W-8,P.x+(cx-tp.x)*1.15));P.y=Math.max(60,Math.min(H-24,P.y+(cy-tp.y)*1.15));tp={x:cx,y:cy}}
cv.addEventListener('touchstart',e=>{e.preventDefault();const k=e.touches[0];down(k.clientX,k.clientY)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const k=e.touches[0];move(k.clientX,k.clientY)},{passive:false});
cv.addEventListener('touchend',e=>{const k=e.changedTouches[0];up(k.clientX,k.clientY)});
cv.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',e=>up(e.clientX,e.clientY));
const add=v=>{const s=v*R.sc;score+=s;xp+=s*R.xp};
function blast(x,y,rd,q){rd=rd||130;let n=0;for(const h of hs){if(!q&&!h.dead&&Math.hypot(h.x-x,h.y-y)<rd){if(h.sh){burst(h.x,h.y,6,INK,160)}else{h.dead=1;burst(h.x,h.y,4,RED,120);n++}}}add(n*15*mult);pt.push({ring:1,x,y,r:10,a:1});flash=.3;if(!q){shake=8;snd(200,.3,'sawtooth',.08,.3);fx.push({x,y,txt:'衝撃波',a:1.2,big:1})}}
function perfect(x,y){
  chain++;chainT=2.4;pc++;
  mult=Math.min(mult+MS*R.pm,MM);
  const p=Math.round(30*mult*R.pf*R.gb*(1+.12*Math.min(chain-1,10)));add(p);
  fx.push({x,y:y-18,txt:(chain>1?'ギリ×'+chain+' +':'ギリ! +')+Math.round(p*R.sc),a:1.4,big:1});
  burst(x,y,22+Math.min(chain,8)*3,RED,320);burst(x,y,8,INK,220);pt.push({ring:1,x,y,r:6,a:1});
  hstop=.09;flash=.32;pop=1;zm=1;shake=Math.max(shake,4+Math.min(chain,6));
  const b=1000+Math.min(chain,12)*70;
  snd(b,.12,'triangle',.08,1.5);setTimeout(()=>snd(b*1.26,.12,'triangle',.07,1.4),55);setTimeout(()=>snd(b*1.5,.22,'triangle',.07,1.3),110);
  buzz(chain>3?[10,20,18]:14);
  if([3,5,8,12,16].includes(chain)){msg={t:'連鎖 ×'+chain,a:1}}
  if(R.slow)slowT=.35+.2*R.slow;
  if(R.pb)blast(x,y,50+25*R.pb,1);
  if(R.ps&&pc%Math.max(4,12-2*R.ps)===0){R.shield++;fx.push({x:P.x,y:P.y+30,txt:'盾 +1',a:1.2,big:1})}}
function graze(x,y){gs=sinceG>1.6?0:gs+1;sinceG=0;if(R.gi)inv=Math.max(inv,R.gi);const pm=Math.floor(mult);mult=Math.min(mult+MS,MM);gc++;const p=Math.round(10*mult*R.gb);add(p);fx.push({x,y,txt:'+'+Math.round(p*R.sc),a:1});burst(x,y,6,INK,150);pop=1;hstop=.02;snd(440*Math.pow(2,(PENT[gs%5]+12*Math.min(2,Math.floor(gs/5)))/12),.09,'square',.045,1.02);buzz(8);
  const m=Math.floor(mult);if(m>pm&&m%5===0){msg={t:'×'+m,a:1};flash=.4;snd(900,.25,'sawtooth',.06,2)}
  if(R.blast&&gc%8===0)blast(P.x,P.y)}
function spawn(){
  const lv=Math.min(t*DF/60,1),r=5+Math.random()*9,x=Math.random()*W;
  let vy=(140+lv*230+Math.random()*120)*R.spd,vx=(Math.random()-.5)*50;
  if(Math.random()<.35+lv*.3){const tt=(P.y+20)/vy;vx=(P.x-x)/tt*.9}
  hs.push({x,y:-20,vx,vy,r,g:false,h:false})}
function laser(){snd(820,.12,'square',.04);const v=Math.random()<.5;ls.push({v,p:(v?P.x:P.y)+(Math.random()-.5)*70,w:1.1,b:.4,g:false});if(t*DF>35&&Math.random()<.3)ls.push({v:!v,p:(!v?P.x:P.y)+(Math.random()-.5)*90,w:1.3,b:.4,g:false})}
function wave(){const x=W*.15+Math.random()*W*.7;hs.push({x,bx:x,y:-20,vx:0,vy:150*R.spd,r:7,g:false,h:false,wv:1,ph:Math.random()*6.28,am:40+Math.random()*40})}
function accel(){const x=Math.random()*W;snd(260,.2,'sawtooth',.03,.4);hs.push({x,y:-20,vx:(P.x-x)*.12,vy:50,ay:380*R.spd,r:8,g:false,h:false,ac:1})}
function wall(){const gp=70+Math.random()*(W-140);snd(110,.45,'sawtooth',.06,3);fx.push({x:gp,y:100,txt:'▼',a:1.2,big:1});for(let x=16;x<W;x+=32)if(Math.abs(x-gp)>60)hs.push({x,y:-20,vx:0,vy:150*R.spd,r:6,g:false,h:false,wl:1})}
function armor(){const x=W*.15+Math.random()*W*.7,vy=105*R.spd,tt=(P.y+20)/vy;snd(180,.3,'sawtooth',.05,.5);fx.push({x,y:100,txt:'盾付き',a:1.2,big:1});hs.push({x,y:-20,vx:(P.x-x)/tt*.5,vy,r:13,g:false,h:false,ar:1,sh:1})}
function ring(){hs.push({x:W*.15+Math.random()*W*.7,y:-20,vx:0,vy:170*R.spd,r:11,g:false,h:false,ring:1,fuse:1.1+Math.random()*.7})}
function hit(){
  if(inv>0)return;
  if(R.shield>0){R.shield--;inv=1.4;shake=10;buzz(40);burst(P.x,P.y,24,RED,320);flash=.5;hstop=.08;snd(150,.35,'sawtooth',.09,.3);pt.push({ring:1,x:P.x,y:P.y,r:10,a:1});hs=hs.filter(h=>Math.hypot(h.x-P.x,h.y-P.y)>110);fx.push({x:P.x,y:P.y,txt:'シールド',a:1});return}
  st='over';deadT=0;shake=14;burst(P.x,P.y,40,INK,420);burst(P.x,P.y,25,RED,320);flash=.6;hstop=.14;snd(110,.6,'sawtooth',.1,.2);buzz([60,40,120]);
  const s=Math.floor(score);if(s>sv.best){sv.best=s;newBest=true}
  sv.bank+=bankGain();save()}
function openPick(){
  st='pick';tp=null;snd(520,.1,'triangle',.07,2);setTimeout(()=>snd(780,.16,'triangle',.07,1.5),90);const a=POOL.slice().sort(()=>Math.random()-.5);cards=a.slice(0,sv.up[4]?4:3);buzz(30)}
function step(dt){
  t+=dt;inv=Math.max(0,inv-dt);add(dt*2);mult=Math.max(1,mult-dt*DK*R.hold);sinceG+=dt;
  chainT-=dt;if(chainT<=0)chain=0;
  beatT-=dt;if(beatT<=0){bc++;const ts=Math.min(sinceG/HT(),1);if(bc%2)snd(130,.08,'sine',.09,.45);else snd(4200,.03,'square',.012);beatT=Math.max(.15,.34-t*DF*.0015-ts*.1-(mult-1)*.006)}
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.14,.62-t*DF*.006)*(1+.3*Math.sin(t/5))*(.7+Math.random()*.6)/R.sp}
  laserT-=dt;if(t*DF>10&&laserT<=0){laser();laserT=Math.max(1.8,5.5-t*DF*.04)*R.lz*(.8+Math.random()*.4)}
  ringT-=dt;if(t*DF>18&&ringT<=0){ring();ringT=Math.max(2.6,7.5-t*DF*.05)*(.8+Math.random()*.4)/R.sp}
  waveT-=dt;if(t*DF>12&&waveT<=0){wave();waveT=Math.max(1.4,4.5-t*DF*.03)*(.8+Math.random()*.4)/R.sp}
  accT-=dt;if(t*DF>20&&accT<=0){accel();accT=Math.max(1.3,5-t*DF*.035)*(.8+Math.random()*.4)/R.sp}
  armT-=dt;if(t*DF>24&&armT<=0){armor();armT=Math.max(5,11-t*DF*.05)*(.8+Math.random()*.4)/R.sp}
  wallT-=dt;if(t*DF>32&&wallT<=0){wall();wallT=Math.max(6,13-t*DF*.06)*(.8+Math.random()*.4)}
  if(Math.random()<.6)pt.push({x:P.x,y:P.y+5,vx:0,vy:40,a:.45,c:'rgba(21,19,15,.5)',s:2});
  if(sinceG>HT()){hs.push({x:Math.random()*W,y:-20,vx:0,vy:0,r:9,g:false,h:true,life:7});sinceG=HT()-1.6;buzz(25);snd(240,.35,'sawtooth',.06,.5)}
  for(const h of hs){
    if(h.dead)continue;
    if(h.ring){h.fuse-=dt;if(h.fuse<=0){h.dead=1;const o=Math.random()*6.28;for(let k=0;k<10;k++){const a=o+k*.628;hs.push({x:h.x,y:h.y,vx:Math.cos(a)*120*R.spd,vy:Math.sin(a)*120*R.spd,r:5,g:false,h:false})}burst(h.x,h.y,10,RED,200);snd(300,.12,'square',.05,.5);continue}}
    if(h.h){const a=Math.atan2(P.y-h.y,P.x-h.x),sp=(75+t*DF*.8)*R.spd;h.vx=Math.cos(a)*sp;h.vy=Math.sin(a)*sp;h.life-=dt}
    h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.wv)h.x=h.bx+Math.sin(t*4+h.ph)*h.am;if(h.ac)h.vy=Math.min(h.vy+h.ay*dt,430*R.spd);
    const d=Math.hypot(h.x-P.x,h.y-P.y);
    if(d<h.r+HIT()){hit();if(st!=='play')return;break}
    if(!h.g&&d<h.r+GR()){h.g=true;graze(h.x,h.y);if(h.ar)add(30*mult*R.gb)}
    if(!h.q&&d<h.r+GR()*.42){h.q=true;perfect(h.x,h.y)}}
  hs=hs.filter(h=>h.y<H+30&&h.x>-40&&h.x<W+40&&!(h.h&&h.life<=0)&&!h.dead);
  for(const l of ls){
    if(l.w>0){l.w-=dt;l.bp=(l.bp||0)-dt;if(l.bp<=0){l.bp=.18;snd(900,.04,'square',.025)}if(l.w<=0){snd(90,.35,'sawtooth',.07,.4);shake=Math.max(shake,3)}continue}
    l.b-=dt;const d=Math.abs((l.v?P.x:P.y)-l.p);
    if(d<5+HIT()){hit();if(st!=='play')return}
    else{if(!l.g&&d<5+GR()){l.g=true;graze(P.x,P.y)}if(!l.q&&d<5+GR()*.42){l.q=true;perfect(P.x,P.y)}}}
  ls=ls.filter(l=>l.b>0);
  for(const f of fx){f.a-=dt*1.6;f.y-=dt*30}fx=fx.filter(f=>f.a>0);
  if(xp>=th(pickN)){pickN++;openPick()}}
function drone(){
  if(!AC)return;
  try{
    if(!dr){const o=AC.createOscillator(),a=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';f.type='lowpass';f.frequency.value=500;a.gain.value=0;o.connect(f);f.connect(a);a.connect(AC.destination);o.start();dr={o,a,f}}
    const on=st==='play',n=AC.currentTime,ts=on?Math.min(sinceG/HT(),1):0;
    dr.a.gain.setTargetAtTime(on?.012+ts*.014:0,n,.15);
    dr.o.frequency.setTargetAtTime(55+(on?mult*7+ts*30:0),n,.1);
    dr.f.frequency.setTargetAtTime(300+(on?mult*60+ts*400:0),n,.1);
  }catch(e){}}
function T(s,x,y,sz,c,al,w){g.font=(w||800)+' '+sz+'px '+F;g.fillStyle=c;g.textAlign=al||'center';g.fillText(s,x,y)}
function btn(i,s,pri){const r=B(i);g.fillStyle=pri?RED:INK;g.fillRect(r.x,r.y,r.w,r.h);T(s,W/2,r.y+33,19,BG)}
function play(){
  g.fillStyle=BG;g.fillRect(-20,-20,W+40,H+40);
  const tense=st==='play'?Math.min(sinceG/HT(),1):0;
  if(mult>2){g.fillStyle='rgba(215,38,61,'+Math.min(.1,(mult-2)*.008)+')';g.fillRect(0,0,W,H)}
  if(tense>0){g.fillStyle='rgba(215,38,61,'+(tense*.16)+')';g.fillRect(0,0,W,H)}
  for(const l of ls){
    if(l.w>0){g.globalAlpha=.4+.4*Math.sin(l.w*40);g.strokeStyle=RED;g.lineWidth=2;g.setLineDash([8,8]);g.beginPath();
      if(l.v){g.moveTo(l.p,0);g.lineTo(l.p,H)}else{g.moveTo(0,l.p);g.lineTo(W,l.p)}g.stroke();g.setLineDash([]);g.globalAlpha=1}
    else{g.fillStyle=RED;if(l.v)g.fillRect(l.p-5,0,10,H);else g.fillRect(0,l.p-5,W,10);g.fillStyle=INK;if(l.v)g.fillRect(l.p-1.5,0,3,H);else g.fillRect(0,l.p-1.5,W,3)}}
  for(const h of hs){
    if(h.wv||h.ac||h.wl){g.fillStyle=h.g?RED:INK;g.beginPath();
      if(h.wv){g.moveTo(h.x,h.y-h.r-3);g.lineTo(h.x+h.r+3,h.y);g.lineTo(h.x,h.y+h.r+3);g.lineTo(h.x-h.r-3,h.y)}
      else if(h.ac){g.moveTo(h.x-h.r-2,h.y-h.r);g.lineTo(h.x+h.r+2,h.y-h.r);g.lineTo(h.x,h.y+h.r+4)}
      else g.rect(h.x-h.r,h.y-h.r,h.r*2,h.r*2);
      g.closePath();g.fill();if(h.wv||h.ac){g.lineWidth=2;g.strokeStyle=h.g?INK:RED;g.stroke()}continue}
    g.beginPath();g.arc(h.x,h.y,h.r,0,7);
    if(h.h){g.fillStyle=RED;g.fill();g.lineWidth=2;g.strokeStyle=INK;g.beginPath();g.arc(h.x,h.y,h.r+5,0,7);g.stroke()}
    else{g.fillStyle=h.g?RED:INK;g.fill();if(h.ar&&h.sh){g.lineWidth=3;g.strokeStyle=RED;g.beginPath();g.arc(h.x,h.y,h.r+5,0,7);g.stroke()}if(h.ring){g.lineWidth=2;g.strokeStyle=RED;g.setLineDash([3,3]);g.beginPath();g.arc(h.x,h.y,h.r+5+Math.sin(t*20)*2,0,7);g.stroke();g.setLineDash([])}}}
  if(st!=='over'&&!(inv>0&&Math.floor(inv*12)%2)){
    g.beginPath();g.arc(P.x,P.y,GR(),0,7);g.setLineDash([3,5]);g.lineWidth=1.2;g.strokeStyle='rgba(21,19,15,.45)';g.stroke();g.setLineDash([]);
    g.beginPath();g.arc(P.x,P.y,HIT()+1.5,0,7);g.fillStyle=BG;g.fill();g.lineWidth=2.5;g.strokeStyle=INK;g.stroke();
    if(R.shield>0){g.beginPath();g.arc(P.x,P.y,10,0,7);g.lineWidth=2;g.strokeStyle=RED;g.stroke()}}
  for(const p of pt){g.globalAlpha=Math.max(0,Math.min(1,p.a));if(p.ring){g.strokeStyle=RED;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke()}else{g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}}g.globalAlpha=1;
  for(const f of fx){g.globalAlpha=Math.min(1,f.a);T(f.txt,f.x,f.y,f.big?21:15,RED);g.globalAlpha=1}
  const p0=pickN?th(pickN-1):0;g.fillStyle=INK;g.fillRect(0,0,W*Math.max(0,Math.min(1,(xp-p0)/(th(pickN)-p0))),4);
  T(String(Math.floor(score)),18,48,34,INK,'left');
  T('かすり '+gc,18,70,13,INK,'left',700);
  T('×'+mult.toFixed(1),W-18,46,26+pop*12,mult>1.4?RED:INK,'right');
  if(R.shield>0)T('盾 '+R.shield,W-18,68,13,RED,'right',700);
  if(tense>.55&&st==='play')T('近づけ。追ってくる。',W/2,92,14,RED,'center',700);
  if(chain>1&&st==='play'){g.globalAlpha=Math.min(1,chainT);T('ギリ連鎖 ×'+chain,W/2,118,16+Math.min(chain,10)*1.5,RED,'center',800);g.globalAlpha=1}
  if(flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.5,flash)+')';g.fillRect(0,0,W,H)}
  if(msg){g.globalAlpha=Math.min(1,msg.a);T(msg.t,W/2,H*.38,64+(1-msg.a)*30,RED);g.globalAlpha=1}}
function draw(){
  g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(zm>0){g.translate(W/2,H/2);g.scale(1+zm*.03,1+zm*.03);g.translate(-W/2,-H/2)}
  if(st==='title'||st==='shop'){
    g.fillStyle=BG;g.fillRect(-20,-20,W+40,H+40)}
  else play();
  if(st==='title'){
    T('ギリ',W/2,H*.24,92,INK);
    T('触れたら終わり。離れても点は入らない。',W/2,H*.24+42,15,INK,'center',700);
    T('かすった数が、次の一戦を強くする。',W/2,H*.24+68,15,RED,'center',700);
    T('レーザーは、光ってから撃たれる。',W/2,H*.24+94,14,INK,'center',600);
    T('かすり '+sv.bank+'  /  ベスト '+sv.best,W/2,H*.54,15,INK,'center',700);
    btn(0,'出撃',1);btn(1,'強化',0)}
  if(st==='shop'){
    T('強化',W/2,64,34,INK);T('所持かすり '+sv.bank,W/2,92,16,RED,'center',700);
    g.save();g.beginPath();g.rect(0,108,W,H-204);g.clip();
    UP.forEach((u,i)=>{
      const r=row(i),mx=sv.up[i]>=u[2],can=!mx&&sv.bank>=cost(i);
      g.fillStyle=can?INK:'rgba(21,19,15,.12)';g.fillRect(r.x,r.y,r.w,r.h);
      const c=can?BG:INK;g.globalAlpha=can||mx?1:.55;
      T(u[0],r.x+14,r.y+28,19,c,'left');T(u[1],r.x+14,r.y+52,12,c,'left',600);
      T(mx?'MAX':cost(i)+' かすり',r.x+r.w-14,r.y+28,17,c,'right');
      T('Lv '+sv.up[i]+' / '+u[2],r.x+r.w-14,r.y+52,12,c,'right',600);g.globalAlpha=1});
    g.restore();
    if(maxSc()>0){const th2=H-204,bh=th2*th2/(th2+maxSc());g.fillStyle='rgba(21,19,15,.25)';g.fillRect(W-6,108+(th2-bh)*sc/maxSc(),3,bh)}
    const b={x:W/2-100,y:H-84,w:200,h:50};g.fillStyle=RED;g.fillRect(b.x,b.y,b.w,b.h);T('戻る',W/2,b.y+33,19,BG)}
  if(st==='pick'){
    g.fillStyle='rgba(236,232,222,.9)';g.fillRect(0,0,W,H);
    T('スコア '+Math.floor(score)+' — 一つ選べ',W/2,H*.14,20,INK);
    cards.forEach((c,i)=>{const r=crd(i);g.fillStyle=c[2]?RED:INK;g.fillRect(r.x,r.y,r.w,r.h);
      T(c[0],r.x+16,r.y+r.h*.42,22,BG,'left');T(c[1],r.x+16,r.y+r.h*.72,14,BG,'left',600)})}
  if(st==='over'){
    g.fillStyle='rgba(236,232,222,.8)';g.fillRect(0,0,W,H);
    T('接触',W/2,H*.2,22,RED);T(String(Math.floor(score)),W/2,H*.2+84,84,INK);
    T(newBest?'ベスト更新':'ベスト '+sv.best,W/2,H*.2+118,16,INK,'center',700);
    T('かすり +'+bankGain()+'  (所持 '+sv.bank+')',W/2,H*.2+146,16,RED,'center',700);
    g.globalAlpha=deadT>.6?1:.25;btn(0,'もう一回',1);btn(1,'強化',0);g.globalAlpha=1}
  g.restore()}
let last=performance.now();
function loop(n){
  const dt=Math.min((n-last)/1000,.05);last=n;
  if(hstop>0)hstop-=dt;else if(st==='play')step(slowT>0?dt*.35:dt);
  for(const p of pt){if(p.ring){p.r+=dt*520;p.a-=dt*3}else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.a-=dt*2.2}}pt=pt.filter(p=>p.a>0);
  pop=Math.max(0,pop-dt*5);zm=Math.max(0,zm-dt*6);slowT=Math.max(0,slowT-dt);flash=Math.max(0,flash-dt*2.2);if(msg){msg.a-=dt*1.3;if(msg.a<=0)msg=null}
  if(st==='over')deadT+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*50);
  draw();drone();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
